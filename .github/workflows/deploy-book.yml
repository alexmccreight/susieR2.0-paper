name: deploy-book

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Needed by actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r manuscript-website/requirements.txt

      - name: Build the book
        run: |
          jupyter-book build . \
            --config manuscript-website/_config.yml \
            --toc manuscript-website/_toc.yml

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
